<style>
  /* Layout: una sola columna; portada-computadora arriba, debajo likes y comentarios */
  :root{
    --bg:#0a0e17; --panel:#121a29; --line:#24304a; --fg:#eef2fa; --muted:#8c99b3;
    --blue:#1e9bff; --yellow:#ffde3c; --red:#ff6b6b;
    --display:"Bricolage Grotesque", "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);}
  body{background:
      linear-gradient(115deg, transparent 0 62%, rgba(30,155,255,.10) 62% 66%, transparent 66% 69%, rgba(255,222,60,.08) 69% 71%, transparent 71%),
      var(--bg);}
  .wrap{max-width:960px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:22px}
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
  h1{margin:0;font-weight:800;font-size:clamp(30px,6vw,54px);letter-spacing:-1px;line-height:1}
  h1 span{color:var(--yellow)}
  .by{font-family:var(--mono);color:var(--muted);font-size:14px}
  .by b{color:var(--fg)}
  .stripe{height:6px;width:150px;border-radius:3px;background:linear-gradient(90deg,var(--yellow) 0 50%,var(--blue) 50%)}

  /* portada: una laptop dibujada con CSS */
  .stage{position:relative}
  .laptop{position:relative;margin:0 auto;max-width:900px;padding:0 4%}
  .stage{overflow-x:clip}
  .screen{position:relative;background:#05080f;border:14px solid #1b2333;border-bottom-width:18px;border-radius:18px 18px 6px 6px;aspect-ratio:16/9;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .base{height:22px;margin:0 -5%;background:linear-gradient(#2a3346,#151b27);border-radius:0 0 22px 22px;position:relative}
  .base::after{content:"";position:absolute;left:42%;right:42%;top:0;height:7px;background:#0d121c;border-radius:0 0 8px 8px}
  .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;border:0;padding:0;width:100%;color:var(--fg);
    background:
      radial-gradient(ellipse at 50% 120%, rgba(30,155,255,.25), transparent 60%),
      #070b14;font-family:var(--display)}
  .code{direction:ltr;position:absolute;inset:0;padding:18px 22px;font-family:var(--mono);font-size:clamp(9px,1.3vw,14px);line-height:1.6;color:#1f2c45;text-align:left;white-space:pre;overflow:hidden;pointer-events:none}
  .code .k{color:#3d5f96}.code .s{color:#6b5f1e}
  .crack{position:absolute;inset:0;pointer-events:none;opacity:.35}
  .cover .t{position:relative;font-weight:800;font-size:clamp(26px,5.5vw,64px);letter-spacing:-1px;text-shadow:0 4px 30px rgba(0,0,0,.8)}
  .cover .t em{font-style:normal;color:var(--yellow)}
  .play{position:relative;width:clamp(70px,11vw,110px);aspect-ratio:1;border-radius:50%;background:var(--yellow);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,222,60,.15),0 10px 40px rgba(0,0,0,.6);transition:transform .15s}
  .play::before{content:"";margin-left:8%;border-left:clamp(22px,3.4vw,34px) solid #111;border-top:clamp(14px,2.1vw,21px) solid transparent;border-bottom:clamp(14px,2.1vw,21px) solid transparent}
  .cover:hover .play,.cover:focus-visible .play{transform:scale(1.08)}
  .cover:focus-visible{outline:3px solid var(--yellow);outline-offset:-6px}
  .hint{position:relative;font-family:var(--mono);color:var(--muted);font-size:clamp(11px,1.4vw,15px)}
  video{position:absolute;inset:0;width:100%;height:100%;background:#000}

  /* reacciones */
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{font-family:var(--display);font-size:17px;font-weight:600;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:10px 18px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
  .btn:hover{border-color:var(--blue)}
  .btn.on.like{background:var(--blue);border-color:var(--blue)}
  .btn.on.dislike{background:var(--red);border-color:var(--red);color:#111}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .count{font-family:var(--mono)}
  .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:14px;color:var(--muted)}
  .who img{width:30px;height:30px;border-radius:50%}
  .google{background:#fff;color:#1f1f1f;border-color:#fff}
  .google:hover{border-color:var(--yellow)}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:var(--mono);font-size:13px}

  /* comentarios */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .panel h2{margin:0;font-size:22px}
  .panel h2 span{color:var(--muted);font-family:var(--mono);font-size:15px;font-weight:400}
  form{display:flex;flex-direction:column;gap:10px}
  textarea{width:100%;min-height:80px;resize:vertical;background:#0b111d;color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px;font:16px/1.4 var(--display)}
  textarea:focus{outline:none;border-color:var(--blue)}
  .emojis{display:flex;flex-wrap:wrap;gap:6px}
  .emojis button{font-size:22px;background:#0b111d;border:1px solid var(--line);border-radius:10px;padding:4px 8px;cursor:pointer}
  .emojis button:hover{border-color:var(--yellow)}
  .send{align-self:flex-end;background:var(--yellow);color:#111;border:0}
  .list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
  .c{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start}
  .c img,.c .av{width:38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800}
  .c .meta{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .c .meta b{color:var(--fg)}
  .c p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.45}
  .empty,.note{color:var(--muted);font-family:var(--mono);font-size:14px;margin:0}
  .note.err{color:var(--red)}
  .soon{display:flex;gap:12px;align-items:center;background:rgba(255,222,60,.12);border:2px dashed var(--yellow);border-radius:14px;padding:14px 16px;color:var(--fg);font-size:17px}
  .soon b{color:var(--yellow)}
  .locked{opacity:.45;pointer-events:none;filter:grayscale(.4)}
  /* idiomas */
  .langs{position:relative}
  .langbtn{font-family:var(--display);font-size:16px;font-weight:600;border:2px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
  .langbtn:hover,.langbtn[aria-expanded="true"]{border-color:var(--yellow)}
  .langmenu{max-height:min(70vh,560px);overflow-y:auto;position:absolute;right:0;top:calc(100% + 8px);z-index:20;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px;min-width:270px;box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px}
  .langmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:600 16px var(--display);padding:10px 12px;border-radius:10px;cursor:pointer}
  .langmenu button:hover,.langmenu button:focus-visible{background:#1b2538;outline:none}
  .langmenu button[aria-checked="true"]{background:rgba(255,222,60,.12)}
  .langmenu .fl{display:inline-flex}
  .flg{width:28px;height:21px;border-radius:4px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.15);object-fit:cover}
  #langFlag{display:inline-flex}
  .langmenu button span:nth-child(2){white-space:nowrap}
  .langmenu .soonb{margin-left:auto;font:600 12px var(--mono);color:var(--muted);background:#0b111d;border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .langmenu .soonb + .ck{margin-left:8px}
  .langmenu .ck{margin-left:auto;color:var(--yellow);font-size:20px;font-weight:800;visibility:hidden}
  .langmenu button[aria-checked="true"] .ck{visibility:visible}
  [dir="rtl"] .langmenu{right:auto;left:0}
  .headr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .sung{color:var(--muted);font-family:var(--mono);font-size:14px;margin:-8px 0 0;text-align:center}
  @media (max-width:560px){.headr{align-items:flex-start}.langmenu{right:auto;left:0}}
  footer{color:var(--muted);font-family:var(--mono);font-size:13px;text-align:center}
  @media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>
</head>

function applyLang(code, fromUser) {
  LANG = code; const L = LANGS[code];
  try { localStorage.setItem("idioma", code); } catch (e) {}
  document.documentElement.lang = L.html; document.documentElement.dir = L.dir || "ltr"; document.title = L.title;
  $("langFlag").innerHTML = flagImg(code); $("langName").textContent = L.name;
  $("h1").innerHTML = L.h1; $("by").innerHTML = L.by; $("coverT").innerHTML = L.coverT; $("code").innerHTML = L.code;
  $("cover").setAttribute("aria-label", L.aria); $("hint").textContent = L.hint;
  $("sung").textContent = L.sung; $("sung").hidden = !L.sung;
  $("soon").innerHTML = L.soon; $("loginTxt").textContent = L.login; $("chTxt").textContent = L.comments;
  $("asTxt").textContent = L.as; $("text").placeholder = L.ph; $("sendBtn").textContent = L.send;
  $("loginHint").textContent = L.loginHint; $("foot").textContent = L.foot;
  const e = $("emptyLi"); if (e) e.textContent = L.empty;
  document.querySelectorAll("#emojis button").forEach(b => b.setAttribute("aria-label", L.add + b.textContent));
  document.querySelectorAll("#who .btn.google").forEach(b => { if (!b.querySelector("svg")) b.textContent = L.login; });

  if (!v.src.endsWith("/" + L.video)) {
    const t = v.currentTime, playing = !v.paused && !v.hidden;

    if (t) v.addEventListener("loadedmetadata", () => { v.currentTime = t; if (playing) v.play().catch(() => {}); }, { once: true });

  let me = null, myVote = 0;

  // Likes / dislikes en vivo
  F.onSnapshot(F.collection(db, "votes"), snap => {
    let l = 0, d = 0; myVote = 0;
    snap.forEach(doc => { const v = doc.data().v; if (v === 1) l++; else if (v === -1) d++; if (me && doc.id === me.uid) myVote = v; });
    $("likes").textContent = l; $("dislikes").textContent = d;
    paintVote();
  });
  function paintVote() {
    $("likeBtn").classList.toggle("on", myVote === 1); $("likeBtn").setAttribute("aria-pressed", myVote === 1);
    $("dislikeBtn").classList.toggle("on", myVote === -1); $("dislikeBtn").setAttribute("aria-pressed", myVote === -1);
  }
  async function vote(v) {
    if (!me) return login();
    const ref = F.doc(db, "votes", me.uid);
    try {
      if (myVote === v) await F.deleteDoc(ref);
      else await F.setDoc(ref, { v, name: me.displayName || T("someone"), ts: F.serverTimestamp() });
    } catch (e) { status(T("vote"), true); }
  }
  $("likeBtn").onclick = () => vote(1);
  $("dislikeBtn").onclick = () => vote(-1);

  // Comentarios en vivo
  const q = F.query(F.collection(db, "comments"), F.orderBy("ts", "desc"), F.limit(200));
  F.onSnapshot(q, snap => {
    const ul = $("list"); ul.innerHTML = "";
    $("ccount").textContent = snap.size ? "· " + snap.size : "";
    if (snap.empty) { const li = document.createElement("li"); li.className = "empty"; li.textContent = T("empty"); ul.appendChild(li); return; }
    snap.forEach(d => {
      const c = d.data(); const li = document.createElement("li"); li.className = "c";
      let av;
      if (c.photo) { av = document.createElement("img"); av.src = c.photo; av.alt = ""; av.referrerPolicy = "no-referrer"; }
      else { av = document.createElement("div"); av.className = "av"; av.textContent = (c.name || "?")[0].toUpperCase(); }
      const body = document.createElement("div");
      const meta = document.createElement("div"); meta.className = "meta";
      const n = document.createElement("b"); n.textContent = c.name || T("someone"); meta.appendChild(n);
      const when = document.createElement("span"); when.textContent = c.ts ? c.ts.toDate().toLocaleString(T("locale"), { dateStyle: "short", timeStyle: "short" }) : T("now"); meta.appendChild(when);
      if (me && c.uid === me.uid) { const del = document.createElement("button"); del.className = "link"; del.textContent = T("del"); del.onclick = () => F.deleteDoc(F.doc(db, "comments", d.id)).catch(() => status(T("delErr"), true)); meta.appendChild(del); }
      const p = document.createElement("p"); p.textContent = c.text;
      body.append(meta, p); li.append(av, body); ul.appendChild(li);
    });
  }, () => status(T("loadErr"), true));

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const text = $("text").value.trim(); if (!text || !me) return;
    $("sendBtn").disabled = true;
    try {
      await F.addDoc(F.collection(db, "comments"), { uid: me.uid, name: me.displayName || T("someone"), photo: me.photoURL || "", text, ts: F.serverTimestamp() });
      $("text").value = ""; status("");
    } catch (err) { status(T("post"), true); }
    $("sendBtn").disabled = false;
  });

  // Sesión con Google
  const provider = new A.GoogleAuthProvider();
  async function login() {
    try { await A.signInWithPopup(auth, provider); }
    catch (e) { if (e.code !== "auth/popup-closed-by-user") status(T("signin"), true); }
  }
  A.onAuthStateChanged(auth, u => {
    me = u; const who = $("who");
    if (u) {
      who.innerHTML = "";
      if (u.photoURL) { const i = document.createElement("img"); i.src = u.photoURL; i.alt = ""; i.referrerPolicy = "no-referrer"; who.appendChild(i); }
      const n = document.createElement("span"); n.textContent = u.displayName || u.email; who.appendChild(n);
      const out = document.createElement("button"); out.className = "link"; out.textContent = T("out"); out.onclick = () => A.signOut(auth); who.appendChild(out);
      $("form").hidden = false; $("loginHint").hidden = true; $("meName").textContent = u.displayName || u.email;
    } else {
      who.innerHTML = ""; const b = $("loginBtnTpl") || null;
      who.appendChild(loginButton());
      $("form").hidden = true; $("loginHint").hidden = false;
    }
    paintVote();
  });
  function loginButton() {
    const b = document.createElement("button"); b.className = "btn google"; b.textContent = T("login"); b.onclick = login; return b;
  }
  $("loginBtn").onclick = login;
}
</script>
</body>
</html>
